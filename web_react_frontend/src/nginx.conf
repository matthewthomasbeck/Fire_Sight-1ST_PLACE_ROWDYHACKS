server {
  listen 80;
  server_name firesight.casa;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy: SPA polls /api/... on firesight.casa, nginx forwards to Flask.
  # host.docker.internal = EC2 host when this nginx runs in Docker.
  # If nginx runs on the host instead, change to http://127.0.0.1:8080/api/
  location /api/ {
    proxy_pass http://host.docker.internal:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }

  location /health {
    proxy_pass http://host.docker.internal:8080/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Static assets must 404 if missing; do not fall back to index.html
  # (that makes fetch("/streams.json") parse HTML and look like a bad list).
  location ~* \.(json|js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
