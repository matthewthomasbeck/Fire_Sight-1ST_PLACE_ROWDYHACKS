server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy so the SPA can poll /api/... without CORS/mixed-content issues.
  location /api/ {
    proxy_pass http://18.223.70.95:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  location / {
    try_files $uri /index.html;
  }
}
